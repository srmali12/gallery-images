<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery with jQuery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body>

<div class="container my-5">
    <h2 class="text-center mb-4" style="color: white;">Image Gallery</h2>

    <!-- Filter Buttons -->
    <div class="text-center mb-4">
        <button class="btn btn-primary filter-btn" data-filter="all">All</button>
        <button class="btn btn-secondary filter-btn" data-filter="nature">Nature</button>
        <button class="btn btn-success filter-btn" data-filter="architecture">Architecture</button>
        <button class="btn btn-danger filter-btn" data-filter="food">Food</button>
    </div>

    <!-- Gallery Grid -->
    <div class="row gallery">
        <div class="col-md-4 mb-4 gallery-item" data-category="nature">
            <img src="images/nature1.jpg" class="img-fluid rounded shadow" alt="Nature 1">
        </div>
        <div class="col-md-4 mb-4 gallery-item" data-category="architecture">
            <img src="images/art1.jpg" class="img-fluid rounded shadow" alt="Architecture 1">
        </div>
        <div class="col-md-4 mb-4 gallery-item" data-category="food">
            <img src="images/food1.jpg" class="img-fluid rounded shadow" alt="food 1">
        </div>
        <div class="col-md-4 mb-4 gallery-item" data-category="nature">
            <img src="images/nature2.jpg" class="img-fluid rounded shadow" alt="Nature 2">
        </div>
        <div class="col-md-4 mb-4 gallery-item" data-category="architecture">
            <img src="images/architecture2.jpg" class="img-fluid rounded shadow" alt="Architecture 2">
        </div>
        <div class="col-md-4 mb-4 gallery-item" data-category="food">
            <img src="images/food2.jpg" class="img-fluid rounded shadow" alt="food 2">
        </div>
        <div class="col-md-4 mb-4 gallery-item" data-category="nature">
            <img src="images/nature3.jpg" class="img-fluid rounded shadow" alt="Nature 3">
        </div>
        <div class="col-md-4 mb-4 gallery-item" data-category="architecture">
            <img src="images/architecture3.jpg" class="img-fluid rounded shadow" alt="Architecture 3">
        </div>
        <div class="col-md-4 mb-4 gallery-item" data-category="food">
            <img src="images/food3.jpg" class="img-fluid rounded shadow" alt="food 3">
        </div>
        <div class="col-md-4 mb-4 gallery-item" data-category="nature">
            <img src="images/nature4.jpg" class="img-fluid rounded shadow" alt="Nature 4">
        </div>
        <div class="col-md-4 mb-4 gallery-item" data-category="architecture">
            <img src="images/architecture1.jpg" class="img-fluid rounded shadow" alt="Architecture 4">
        </div>
        <div class="col-md-4 mb-4 gallery-item" data-category="food">
            <img src="images/food4.jpg" class="img-fluid rounded shadow" alt="food 4">
        </div>
    </div>
</div>

<!-- Custom JS -->
<script src="script.js"></script>

</body>
</html>
